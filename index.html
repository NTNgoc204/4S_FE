<!doctype html>
<html lang="vi">
  <head>
    <!-- Anti-FOUC: apply theme attrs synchronously before any paint -->
    <script>
      (function() {
        try {
          var mode  = localStorage.getItem('theme_mode')  || 'dark';
          var color = localStorage.getItem('color_theme') || 'emerald';
          document.documentElement.setAttribute('data-theme-mode',  mode);
          document.documentElement.setAttribute('data-color-theme', color);
        } catch(e) {}
      })();
    </script>

    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="%VITE_GOOGLE_SITE_VERIFICATION%" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <title>4S - Hướng Nghiệp & Định Hướng Trường Đại Học Thông Minh</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
